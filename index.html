<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tax Planner</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px}
.container{max-width:800px;margin:auto;background:#1e293b;padding:20px;border-radius:10px}
input,select{width:100%;padding:8px;margin:6px 0}
button{padding:10px;background:#f59e0b;border:none;color:#000;width:100%;margin-top:10px}
.box{background:#334155;padding:15px;border-radius:8px;margin-top:15px}
</style>
</head>

<body>
<div class="container">

<h2>Tax Planner FY 2026-27</h2>

<label>Employee Code</label>
<input id="empCode">

<label>PAN</label>
<input id="pan">

<label>Gross Salary</label>
<input id="gross" type="number">

<label>Basic Salary</label>
<input id="basic" type="number">

<label>Flexi Pay</label>
<input id="flexi" type="number">

<label>Tax Regime</label>
<select id="regime">
<option value="new">New</option>
<option value="old">Old</option>
</select>

<div class="box">
<h3>Employer NPS</h3>
<input id="empNPS" type="number">
<p id="npsLimit"></p>
</div>

<div class="box">
<h3>Employee NPS (Old Only)</h3>
<input id="selfNPS" type="number">
</div>

<p id="warn" style="color:red"></p>

<div class="box">
<h3>Tax Comparison</h3>
<p>Old Tax: <span id="oldTax">0</span></p>
<p>New Tax: <span id="newTax">0</span></p>
<p>Recommended: <span id="best"></span></p>
</div>

<button onclick="calc()">Calculate</button>
<button onclick="submitData()">Submit</button>

</div>

<script>

// ✅ APPS SCRIPT
const API="https://script.google.com/macros/s/AKfycbwJ1d0BRhWExkeW977fIROIIMonkFcUohHb0OV3uQzYiuhJSdD4J6SIlNdBD0GS4Lc-/exec";

function num(v){return Number(v)||0}

// ✅ NPS LIMIT
function getNPSLimit(basic,flexi){
return Math.min(basic*0.10,flexi);
}

// ✅ TAX CALC
function oldTaxCalc(i){
if(i<=250000)return 0;
if(i<=500000)return (i-250000)*0.05;
if(i<=1000000)return 12500+(i-500000)*0.20;
return 112500+(i-1000000)*0.30;
}

function newTaxCalc(i){
if(i<=300000)return 0;
if(i<=600000)return (i-300000)*0.05;
if(i<=900000)return 15000+(i-600000)*0.10;
if(i<=1200000)return 45000+(i-900000)*0.15;
if(i<=1500000)return 90000+(i-1200000)*0.20;
return 150000+(i-1500000)*0.30;
}

// ✅ MAIN CALC
function calc(){

let gross=num(document.getElementById("gross").value);
let basic=num(document.getElementById("basic").value);
let flexi=num(document.getElementById("flexi").value);
let regime=document.getElementById("regime").value;

let empNPS=num(document.getElementById("empNPS").value);
let selfNPS=num(document.getElementById("selfNPS").value);

// Employee NPS only old
if(regime==="old"){
selfNPS=Math.min(selfNPS,50000);
}else{
selfNPS=0;
}

// Employer NPS limit
let limit=getNPSLimit(basic,flexi);

if(empNPS>limit){
empNPS=limit;
document.getElementById("empNPS").value=limit;
}

document.getElementById("npsLimit").innerText="Max Allowed ₹"+limit;

// Flexi validation
if(empNPS>flexi){
document.getElementById("warn").innerText="Exceeds Flexi Limit";
}else{
document.getElementById("warn").innerText="";
}

// OLD
let oldTaxable=Math.max(0,gross-50000-selfNPS-empNPS);
let oldTax=oldTaxCalc(oldTaxable)*1.04;

// NEW
let newTaxable=Math.max(0,gross-75000-empNPS);
let newTax=newTaxCalc(newTaxable)*1.04;

// Update UI
document.getElementById("oldTax").innerText="₹"+Math.round(oldTax);
document.getElementById("newTax").innerText="₹"+Math.round(newTax);

document.getElementById("best").innerText=
oldTax<newTax?"Old Regime":"New Regime";

}

// ✅ SUBMIT
function submitData(){

let payload={
empCode:document.getElementById("empCode").value,
pan:document.getElementById("pan").value,
gross:document.getElementById("gross").value,
basic:document.getElementById("basic").value,
flexi:document.getElementById("flexi").value,
empNPS:document.getElementById("empNPS").value,
selfNPS:document.getElementById("selfNPS").value,
regime:document.getElementById("regime").value
};

fetch(API,{
method:"POST",
body:JSON.stringify(payload)
})
.then(r=>r.json())
.then(res=>{
if(res.status==="success"){
alert("Submitted Successfully");
}else{
alert(res.message);
}
})
.catch(()=>alert("Error"));

}

</script>
</body>
</html>
